<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phong bì thư Hoa Mẫu Đơn Sang Trọng</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #f0f2f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 42px;
            color: #a85959;
            font-style: italic;
            font-weight: 300;
            letter-spacing: 2px;
            margin: 0;
            font-family: 'Brush Script MT', cursive;
        }

        .heart {
            color: #2d5a4f;
            margin: 0 10px;
            font-size: 32px;
        }

        /* --- Khung chứa toàn bộ phong bì --- */
        .envelope-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .envelope-container {
            position: relative;
            width: 620px;
            height: 420px;
            cursor: pointer;
        }

        /* --- Bông hoa mẫu đơn màu hồng cam (CSS + SVG độc lập) --- */
        .peony-flower {
            position: absolute;
            top: -65px;
            left: -75px;
            width: 250px;
            height: 250px;
            z-index: 20; /* Luôn nằm trên cùng */
            pointer-events: none; /* Không cản trở việc click vào phong bì */
            filter: drop-shadow(4px 8px 12px rgba(0, 0, 0, 0.3));
        }

        /* --- Thân Phong Bì --- */
        .envelope {
            position: relative;
            width: 100%;
            height: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            perspective: 1500px;
            border-radius: 4px;
            overflow: visible;
        }

        /* Mặt sau bên trong lòng phong bì */
        .inner-back {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #1b2e21; /* Màu xanh lá tối nhất tạo chiều sâu */
            border-radius: 4px;
            z-index: 1;
        }

        /* --- Lá thư bên trong --- */
        .letter {
            position: absolute;
            top: 25px;
            left: 25px;
            right: 25px;
            bottom: 25px;
            background-color: #fcfbf9;
            border-radius: 2px;
            padding: 30px;
            z-index: 2;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Nội dung giả lập cho lá thư */
        .letter-content {
            width: 100%;
            height: 100%;
            border: 1px dashed #e0dcd3;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .letter-line {
            height: 8px;
            background-color: #f0ede4;
            border-radius: 4px;
        }
        .letter-line.short { width: 60%; }
        .letter-line.medium { width: 85%; }

        /* Hiệu ứng đẩy thư lên khi mở */
        .envelope-container.open .letter {
            transform: translateY(-140px);
        }

        /* --- Các cánh gấp phong bì (Flaps) --- */
        .flap {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .left-flap {
            clip-path: polygon(0 0, 51% 50%, 0 100%);
            background-color: #243d2b;
            z-index: 3;
        }

        .right-flap {
            clip-path: polygon(100% 0, 49% 50%, 100% 100%);
            background-color: #243d2b;
            z-index: 3;
        }

        .bottom-flap {
            clip-path: polygon(0 100%, 50% 48%, 100% 100%);
            background-color: #284430;
            z-index: 4;
            filter: drop-shadow(0 -3px 5px rgba(0, 0, 0, 0.15));
        }

        /* --- Nắp gập phía trên & Trục xoay --- */
        .top-flap-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 62%;
            z-index: 5;
            transform-origin: top;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), z-index 0s 0.3s;
            filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.3));
        }

        .top-flap {
            width: 100%;
            height: 100%;
            background-color: #2c4c36; /* Tone xanh sáng hơn một chút tạo khối phẳng */
            clip-path: polygon(0 0, 100% 0, 50% 100%);
        }

        /* Khi mở: lật ngược nắp 180 độ lên trên và lùi về sau lá thư */
        .envelope-container.open .top-flap-wrapper {
            transform: rotateX(180deg);
            z-index: 0;
        }

        /* --- Dấu Ấn Sáp Đỏ --- */
        .wax-seal {
            position: absolute;
            top: 62%; /* Định vị ngay đỉnh tam giác của nắp gập */
            left: 50%;
            transform: translate(-50%, -50%) scale(1);
            width: 76px;
            height: 76px;
            background: radial-gradient(circle, #b31919 20%, #800a0a 75%, #4d0202 100%);
            border-radius: 50%;
            z-index: 6;
            box-shadow: 0 6px 12px rgba(0,0,0,0.45), inset 0 2px 4px rgba(255,255,255,0.3);
            transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Vòng viền nổi bên trong dấu sáp */
        .wax-seal::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 56px;
            height: 56px;
            border: 3px solid #610404;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.6);
            background-color: transparent;
        }

        /* Biến mất mượt mà khi phong bì mở */
        .envelope-container.open .wax-seal {
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.6);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Ngọc Dung <span class="heart">💚</span> Minh Tiến</h1>
    </div>

    <div class="envelope-wrapper">
        <div class="envelope-container" id="bi-thu">

        <div class="peony-flower">
            <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <filter id="petal-shadow" x="-10%" y="-10%" width="120%" height="120%">
                        <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#5c2612" flood-opacity="0.2"/>
                    </filter>
                </defs>
                <g id="peony">
                    <g filter="url(#petal-shadow)">
                        <path d="M100,10 C140,-5 185,25 175,70 C205,100 190,165 145,175 C110,205 45,190 30,150 C-5,125 5,55 55,40 Z" fill="#fca180" />
                        <path d="M100,20 C135,5 170,35 165,75 C190,105 175,150 140,155 C110,180 55,170 45,135 C15,115 25,65 65,50 Z" fill="#ffb394" />
                    </g>

                    <g filter="url(#petal-shadow)">
                        <path d="M100,32 C125,15 160,45 150,80 C170,110 145,145 115,145 C85,160 45,135 50,100 C35,75 65,40 90,45 Z" fill="#f38663" />
                        <path d="M105,42 C125,30 150,55 142,85 C158,108 135,135 110,132 C88,145 58,125 62,98 C50,78 75,50 95,55 Z" fill="#f79777" />
                    </g>

                    <g filter="url(#petal-shadow)">
                        <path d="M100,55 C118,45 135,65 128,88 C138,105 118,122 100,120 C82,125 72,105 75,88 C70,70 88,52 95,58 Z" fill="#e26d46" />
                        <path d="M98,62 C112,54 125,70 120,86 C128,98 112,112 98,110 C85,112 78,98 80,86 C76,74 88,62 94,66 Z" fill="#f58c67" />
                    </g>

                    <g id="stamens">
                        <circle cx="100" cy="88" r="20" fill="#df9b19" opacity="0.8"/>
                        <circle cx="92" cy="76" r="4" fill="#f9ca24"/>
                        <circle cx="108" cy="76" r="4" fill="#f0932b"/>
                        <circle cx="114" cy="85" r="4" fill="#f9ca24"/>
                        <circle cx="106" cy="98" r="4" fill="#f5b041"/>
                        <circle cx="94" cy="98" r="4" fill="#f9ca24"/>
                        <circle cx="86" cy="86" r="4" fill="#f39c12"/>
                        <circle cx="100" cy="87" r="11" fill="#f1c40f"/>
                        <circle cx="98" cy="85" r="6" fill="#feffff" opacity="0.4"/>
                        <circle cx="101" cy="89" r="5" fill="#9a7d0a"/>
                    </g>
                </g>
            </svg>
        </div>

        <div class="envelope">
            <div class="inner-back"></div>

            <div class="letter">
                <div class="letter-content">
                    <div class="letter-line"></div>
                    <div class="letter-line medium"></div>
                    <div class="letter-line"></div>
                    <div class="letter-line short"></div>
                    <div class="letter-line medium"></div>
                </div>
            </div>

            <div class="left-flap flap"></div>
            <div class="right-flap flap"></div>
            <div class="bottom-flap flap"></div>

            <div class="top-flap-wrapper">
                <div class="top-flap"></div>
            </div>

            <div class="wax-seal"></div>
        </div>
        </div>
    </div>

    <script>
        const biThu = document.getElementById('bi-thu');

        // Lắng nghe sự kiện click chuột để bật/tắt trạng thái mở phong bì
        biThu.addEventListener('click', () => {
            biThu.classList.toggle('open');
        });
    </script>

</body>
</html>
